---
name: Build for legacy GLIBC

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.1.8). Leave empty to build latest upstream tag."
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      failed_marker: ${{ steps.resolve.outputs.failed_marker }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag to build
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            LATEST_TAG="$INPUT_TAG"
            echo "Using manually specified tag: $LATEST_TAG"
          else
            # Get latest upstream tag
            LATEST_TAG=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name')
            echo "Latest upstream tag: $LATEST_TAG"
          fi

          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "No tags found"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILD_TREE=$(git rev-parse HEAD:build)
          FAILED_MARKER="ci-failed/${LATEST_TAG}/${BUILD_TREE}"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "failed_marker=$FAILED_MARKER" >> "$GITHUB_OUTPUT"

          # Manual runs explicitly retry a version even if this build tree rejected it.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$FAILED_MARKER" >/dev/null 2>&1; then
            echo "$LATEST_TAG already failed with build tree $BUILD_TREE, skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if we already have a release for this tag
          RELEASE_EXISTS=$(gh release view "$LATEST_TAG" --json tagName 2>/dev/null || echo "")
          if [[ -n "$RELEASE_EXISTS" ]]; then
            echo "Release for $LATEST_TAG already exists, skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New tag found: $LATEST_TAG"
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binary
        run: |
          docker build \
            --build-arg VERSION=${{ needs.check.outputs.tag }} \
            --output type=local,dest=./dist \
            ./build/legacy-glibc

      - name: Prepare CentOS 7 test image
        run: |
          # Copy the build output into ./out so the test Dockerfiles can find it.
          rm -rf out
          mv dist out

          docker build --platform linux/amd64 \
            -t opencode-test-centos7 \
            -f build/test/Dockerfile.centos7 .

      - name: Run test suite on CentOS 7 (glibc 2.17, stricter than QTS NAS 2.21)
        id: test
        continue-on-error: true
        run: |
          docker run --platform linux/amd64 --rm opencode-test-centos7 \
            sh /opt/test-env.sh

      - name: Record rejected build
        if: steps.test.outcome == 'failure'
        env:
          FAILED_MARKER: ${{ needs.check.outputs.failed_marker }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$FAILED_MARKER" >/dev/null 2>&1; then
            echo "Failure marker already exists: $FAILED_MARKER"
          else
            git tag "$FAILED_MARKER" "$GITHUB_SHA"
            git push origin "refs/tags/$FAILED_MARKER"
          fi

      - name: Fail rejected build
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Create tarball
        run: |
          cd out
          tar -czvf opencode-${{ needs.check.outputs.tag }}-linux-x64-legacy-glibc.tar.gz opencode

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ needs.check.outputs.tag }}-linux-x64-legacy-glibc
          path: out/opencode-${{ needs.check.outputs.tag }}-linux-x64-legacy-glibc.tar.gz

      - name: Create release
        run: |
          gh release create "${{ needs.check.outputs.tag }}" \
            --title "OpenCode ${{ needs.check.outputs.tag }} (Legacy GLIBC)" \
            --notes "OpenCode ${{ needs.check.outputs.tag }} built with bundled musl libraries for systems with older GLIBC versions.

          ## Installation
          1. Using mise:

            \`\`\`bash
            mise install github:pedropombeiro/opencode-legacy-glibc@${{ needs.check.outputs.tag }}
            \`\`\`

          2. Manual:
            1. Download and extract the tarball
            2. Run \`./opencode/bin/opencode\`

          Based on upstream release: https://github.com/anomalyco/opencode/releases/tag/${{ needs.check.outputs.tag }}" \
            out/opencode-${{ needs.check.outputs.tag }}-linux-x64-legacy-glibc.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
